apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentcore-backend
  labels:
    app: agentcore-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agentcore-backend
  template:
    metadata:
      labels:
        app: agentcore-backend
    spec:
      containers:
      - name: agentcore-backend
        image: agentcore-backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: agentcore-db-secret
              key: database-url
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agentcore-backend-svc
spec:
  selector:
    app: agentcore-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP